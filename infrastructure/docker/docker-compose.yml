services:
  postgres:
    image: postgres:17-alpine
    container_name: worko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worko_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-worko_dev}
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - worko_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: worko-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:16379:6379'
    volumes:
      - worko_redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  worko_postgres_data:
  worko_redis_data:
